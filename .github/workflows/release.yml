name: Release

# Publishes to npm when a version tag is pushed (create one with `npm version patch|minor|major`).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. Configure it once on
# npmjs.com → package → Settings → Trusted publishing → GitHub Actions, workflow file `release.yml`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow and attach provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - name: Skip versions already on npm
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "$name@$v is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: git config --global user.email ci@example.com && git config --global user.name CI
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      # prepublishOnly runs lint + tests; prepack builds dist/.
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
